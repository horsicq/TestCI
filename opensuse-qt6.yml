name: Build DIE-engine (openSUSE Qt6 RPM)

on:
  workflow_dispatch:

jobs:
  build-opensuse-qt6:
    runs-on: ubuntu-latest

    container:
      image: opensuse/leap:latest

    steps:
      - name: Install dependencies
        run: |
          zypper refresh
          zypper install -y \
            git \
            cmake \
            gcc-c++ \
            make \
            rpm-build \
            rpmdevtools \
            qt6-base-devel \
            qt6-tools-devel \
            qt6-svg-devel

      - name: Clone DIE-engine
        run: |
          git clone --recursive \
            https://github.com/horsicq/DIE-engine \
            $HOME/DIE-engine

      - name: Build RPM
        run: |
          cd $HOME/DIE-engine

          pwd
          ls -la

          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr

          cmake --build build -j$(nproc)

          cd build

          cpack -G RPM

      - name: Collect RPM
        run: |
          mkdir -p release

          find $HOME/DIE-engine/build \
            -name '*.rpm' \
            -exec cp {} release/DIE-engine-opensuse-qt6-x86_64.rpm \;

          ls -lah release

      - name: Verify RPM
        run: |
          test -f release/DIE-engine-opensuse-qt6-x86_64.rpm

      - name: Upload RPM Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Beta
          draft: false
          prerelease: true
          files: |
            release/*.rpm
name: Build DIE-engine (OpenBSD Package)

on:
  workflow_dispatch:

jobs:
  build-openbsd:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build on OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          release: "7.7"
          usesh: true

          prepare: |
            set -ex

            pkg_add -I git cmake ninja pkgconf

            # Qt packages
            pkg_add -I qt5-qtbase qt5-qtsvg

          run: |
            set -euxo pipefail

            cd "$GITHUB_WORKSPACE"

            echo "Building from:"
            pwd
            ls -la

            cmake \
              -B build \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr/local

            cmake --build build \
              --parallel "$(sysctl -n hw.ncpu)"

            rm -rf /tmp/package-root
            mkdir -p /tmp/package-root

            DESTDIR=/tmp/package-root \
              cmake --install build

            mkdir -p /tmp/package-root/+DESC

            printf '%s\n' \
              "Detect It Easy" \
              "" \
              "File type identification tool" \
              "https://github.com/horsicq/DIE-engine" \
              > /tmp/package-root/+DESC

            mkdir -p release

            tar \
              -czf \
              release/detect-it-easy-4.0.0-openbsd.tgz \
              -C /tmp/package-root \
              .

            echo "Package created:"
            ls -lh release/

      - name: Upload OpenBSD package
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Beta
          draft: false
          prerelease: true
          files: |
            release/*.tgz
name: Build DIE-engine (OpenBSD)

on:
  workflow_dispatch:
  release:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-openbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Run OpenBSD Build & Package
        uses: cross-platform-actions/action@v0.25.0
        with:
          operating_system: openbsd
          version: '7.5'
          run: |
            sudo pkg_add git cmake qt5-qtbase qt5-qtsvg qt5-qtscript qt5-qttools gmake
            
            mkdir build
            cd build
            cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local
            gmake -j$(sysctl -n hw.ncpu)
            
            DESTDIR=$(pwd)/../stage cmake --install .
            cd ..
            
            echo "Detect It Easy (DiE) - Program for determining types of files" > +COMMENT
            echo "Detect It Easy (DiE) is a program for determining types of files." > +DESC
            
            cd stage/usr/local
            find . -type f | sed 's|^\./||' > ../../+PLIST
            cd ../..
            
            mkdir -p release
            pkg_create -p /usr/local -P stage/usr/local -c +COMMENT -d +DESC -f +PLIST release/detect-it-easy-openbsd.tgz

      - name: Upload OpenBSD Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tag_name: Beta
          draft: false
          prerelease: true
          files: release/*.tgz
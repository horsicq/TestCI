name: Build DIE-engine (OpenBSD)

on:
  workflow_dispatch:
  release:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-openbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Run OpenBSD Build & Package
        uses: vmactions/openbsd-vm@v1
        with:
          prepare: |
            pkg_add git gmake cmake qtbase qtsvg qtscript qttools
          run: |
            mkdir -p build
            cd build
            
            cmake ..
            gmake -j$(nproc)
            
            cd ..
            mkdir -p release
            tar -czf release/DetectItEasy-openbsd-amd64.tar.gz -C build .

      - name: Upload OpenBSD Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tag_name: Beta
          draft: false
          prerelease: true
          files: |
            release/*.tar.gz
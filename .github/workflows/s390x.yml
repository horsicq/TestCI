name: Build Detect It Easy s390x

on:
  workflow_dispatch:
  push:
    branches:
      - "*"

env:
  SRC_PATH: DIE-engine


jobs:

  build-s390x:

    name: Build s390x
    runs-on: ubuntu-24.04

    steps:

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3


      - name: Clone DIE-engine
        run: |
          git clone https://github.com/horsicq/DIE-engine.git --recursive ${{ env.SRC_PATH }}


      - name: Install dependencies (s390x)
        run: |
          printf '%s\n' \
            'set -ex' \
            'apt-get update' \
            'DEBIAN_FRONTEND=noninteractive apt-get install -y \
              build-essential \
              cmake \
              ninja-build \
              git \
              qtbase5-dev \
              qttools5-dev \
              libqt5svg5-dev \
              qtscript5-dev \
              tar \
              gzip' \
          | docker run --rm -i \
              --platform linux/s390x \
              -v "${PWD}/${{ env.SRC_PATH }}:/src" \
              -w /src \
              s390x/ubuntu:24.04 \
              bash


      - name: CMake configure
        run: |
          printf '%s\n' \
            'set -ex' \
            'cd /src' \
            'cmake -B build \
              -DCMAKE_BUILD_TYPE=Release' \
          | docker run --rm -i \
              --platform linux/s390x \
              -v "${PWD}/${{ env.SRC_PATH }}:/src" \
              -w /src \
              s390x/ubuntu:24.04 \
              bash


      - name: CMake compile
        run: |
          printf '%s\n' \
            'set -ex' \
            'cd /src' \
            'cmake --build build -j$(nproc)' \
          | docker run --rm -i \
              --platform linux/s390x \
              -v "${PWD}/${{ env.SRC_PATH }}:/src" \
              -w /src \
              s390x/ubuntu:24.04 \
              bash


      - name: Create portable archive
        run: |
          printf '%s\n' \
            'set -ex' \
            'cd /src/build' \
            'mkdir -p package' \
            'cp -a ./* package/ || true' \
            'tar -czf /src/detect-it-easy-s390x.tar.gz package' \
          | docker run --rm -i \
              --platform linux/s390x \
              -v "${PWD}/${{ env.SRC_PATH }}:/src" \
              -w /src \
              s390x/ubuntu:24.04 \
              bash


      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: detect-it-easy-s390x
          path: ${{ env.SRC_PATH }}/detect-it-easy-s390x.tar.gz


      - name: Upload Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tag_name: Beta
          draft: false
          prerelease: true
          files: |
            ${{ env.SRC_PATH }}/detect-it-easy-s390x.tar.gz
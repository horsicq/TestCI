name: Build DIE-engine Nix

on:
  workflow_dispatch:

jobs:
  build-nix:
    runs-on: ubuntu-latest

    steps:
      - name: Clone DIE-engine
        run: |
          git clone --recursive \
            https://github.com/horsicq/DIE-engine.git

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_conf: |
            experimental-features = nix-command flakes

      - name: Build with Nix
        run: |
          nix-build DIE-engine/build.nix

      - name: Create Release Archive
        run: |
          mkdir -p release
          tar -czf release/detect-it-easy-4.0.0-linux-nix.tar.gz -C result .

      - name: Upload Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tag_name: Beta
          draft: false
          prerelease: true
          files: |
            release/*.tar.gz
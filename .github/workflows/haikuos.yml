name: Build DIE-engine (Haiku OS)

on:
  workflow_dispatch:
  release:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-haiku:
    runs-on: ubuntu-latest
    steps:
      - name: Run Haiku Build & Package
        uses: cross-platform-actions/action@v1.3.0
        with:
          operating_system: haiku
          version: 'r1beta5'
          run: |
            pkgman add-repo https://eu.hpkg.haiku-os.org/haiku/master/x86_64/current || true
            pkgman add-repo https://eu.hpkg.haiku-os.org/haikuports/master/x86_64/current || true
            
            pkgman refresh
            pkgman -y full-sync
            pkgman -y install git cmake gcc make qt5_devel qt5_tools qt5_script_devel
            
            git clone https://github.com/horsicq/DIE-engine --recursive
            cd DIE-engine
            
            perl -pi -e 's/TARGET Qt6::Core/TARGET Qt6_Disabled::Core/g' src/CMakeLists.txt
            perl -pi -e 's/NAMES Qt6 Qt5/NAMES Qt5 Qt6/g' src/CMakeLists.txt
            
            mkdir build
            cd build
            cmake .. \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/boot/system \
              -DCMAKE_PREFIX_PATH="/boot/system/develop/lib/cmake"
            
            make -j$(sysctl -n hw.ncpu)
            
            DESTDIR=$(pwd)/../stage cmake --install .
            cd ..
            
            echo "Detect It Easy (DiE) - Program for determining types of files" > +COMMENT
            echo "Detect It Easy (DiE) is a program for determining types of files." > +DESC
            
            cd stage/boot/system
            find . -type f | sed 's|^\./||' > ../../+PLIST
            cd ../..
            
            mkdir -p release
            pkg_create -p /boot/system -P stage/boot/system -c +COMMENT -d +DESC -f +PLIST release/detect-it-easy-haiku.hpkg

      - name: Upload Haiku Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tag_name: Beta
          draft: false
          prerelease: true
          files: release/*.hpkg
name: Build Debian m68k

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

env:
  RELEASE_PATH: release

jobs:
  build-debian-m68k:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU and Bootstrap Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support mmdebstrap debian-ports-archive-keyring

      - name: Bootstrap m68k Environment
        run: |
          sudo mmdebstrap \
            --architectures=m68k \
            --variant=buildd \
            --include="git,qtbase5-dev,qtscript5-dev,qttools5-dev,qttools5-dev-tools,libqt5svg5-dev,qtchooser,build-essential,cmake" \
            unstable ./m68k-chroot \
            "deb http://ftp.ports.debian.org/debian-ports/ unstable main" \
            "deb http://ftp.ports.debian.org/debian-ports/ unreleased main"

      - name: Build DIE-engine inside m68k chroot
        run: |
          sudo cp -a "${{ github.workspace }}" ./m68k-chroot/workspace
          
          sudo chroot ./m68k-chroot /bin/bash -ex -c '
            cd /workspace
            git clone --recursive https://github.com/horsicq/DIE-engine.git
            cd DIE-engine
            chmod a+x build_dpkg.sh
            ./build_dpkg.sh
          '

      - name: Collect packages
        run: |
          mkdir -p "${{ env.RELEASE_PATH }}"
          sudo find ./m68k-chroot/workspace/DIE-engine -type f -name "*.deb" -exec cp {} "${{ env.RELEASE_PATH }}/" \;
          sudo chown -R $USER:$USER "${{ env.RELEASE_PATH }}"

      - name: Verify package architecture
        run: |
          shopt -s nullglob
          packages=("${{ env.RELEASE_PATH }}"/*.deb)

          if [ ${#packages[@]} -eq 0 ]; then
            echo "No .deb package was produced."
            exit 1
          fi

          for package in "${packages[@]}"; do
            echo "Package: $package"
            ARCH=$(dpkg-deb -f "$package" Architecture)
            echo "Architecture: $ARCH"

            if [ "$ARCH" != "m68k" ]; then
              echo "ERROR: Package is not m68k!"
              exit 1
            fi
          done

      - name: Upload Release as Download
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tag_name: Beta
          draft: false
          prerelease: true
          files: |
            ${{ env.RELEASE_PATH }}/*.deb
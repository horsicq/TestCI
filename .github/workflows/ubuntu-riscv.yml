name: Build DIE-engine RISC-V64

on:
  workflow_dispatch:

jobs:
  build-riscv64:
    runs-on: ubuntu-latest

    steps:
      - name: Clone DIE-engine
        run: |
          git clone --recursive \
            https://github.com/horsicq/DIE-engine.git

      - name: Install RISC-V64 toolchain and host Qt tools
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            cmake \
            ninja-build \
            pkg-config \
            build-essential \
            gcc-riscv64-linux-gnu \
            g++-riscv64-linux-gnu \
            qemu-user-static \
            debootstrap \
            binfmt-support \
            qttools5-dev-tools \
            qtbase5-dev

      - name: Create RISC-V64 Ubuntu Sysroot with Qt5
        run: |
          sudo mkdir -p /opt/riscv64-sysroot

          sudo debootstrap \
            --arch=riscv64 \
            --foreign \
            --components=main,universe,multiverse,restricted \
            jammy \
            /opt/riscv64-sysroot \
            http://ports.ubuntu.com/ubuntu-ports

          sudo cp /usr/bin/qemu-riscv64-static \
            /opt/riscv64-sysroot/usr/bin/

          sudo chroot /opt/riscv64-sysroot \
            /debootstrap/debootstrap \
            --second-stage

          sudo printf '%s\n' \
            "deb http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse" \
            "deb http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse" \
            "deb http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse" \
            | sudo tee /opt/riscv64-sysroot/etc/apt/sources.list > /dev/null

          sudo chroot /opt/riscv64-sysroot apt-get update

          sudo chroot /opt/riscv64-sysroot apt-get install -y \
            qtbase5-dev \
            qtscript5-dev \
            qttools5-dev \
            qttools5-dev-tools \
            libqt5svg5-dev

      - name: Build RISC-V64
        working-directory: DIE-engine
        run: |
          cmake \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=riscv64 \
            -DCMAKE_SYSROOT=/opt/riscv64-sysroot \
            -DCMAKE_C_COMPILER=riscv64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=riscv64-linux-gnu-g++ \
            -DCMAKE_PREFIX_PATH=/opt/riscv64-sysroot/usr/lib/riscv64-linux-gnu/cmake \
            -DQT_LRELEASE_EXECUTABLE=/usr/bin/lrelease

          cmake \
            --build build \
            --parallel $(nproc)

      - name: Check binary architecture
        run: |
          find DIE-engine/build -type f -executable -exec file {} \;

      - name: Create Release Archive
        run: |
          mkdir -p release

          tar \
            -czf \
            release/detect-it-easy-4.0.0-linux-riscv64.tar.gz \
            -C DIE-engine/build \
            .

      - name: Upload Release as Download
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tag_name: Beta
          draft: false
          prerelease: true
          files: |
            release/*.tar.gz
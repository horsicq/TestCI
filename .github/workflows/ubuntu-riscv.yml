name: Build Detect It Easy riscv64

on:
  workflow_dispatch:
  push:
    branches:
      - "*"

env:
  RELEASE_PATH: release

jobs:
  build-ubuntu-24-riscv64:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Dependencies
        run: |
          sudo dpkg --add-architecture riscv64
          
          sudo sed -i 's/^Types: deb/Types: deb\nArchitectures: amd64/' /etc/apt/sources.list.d/ubuntu.sources
          sudo find /etc/apt/sources.list* -type f -name "*.list" -exec sed -i -E 's/^deb ([^\[])/deb [arch=amd64] \1/g' {} +
          
          cat <<EOF | sudo tee /etc/apt/sources.list.d/ubuntu-ports.sources
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: noble noble-updates noble-backports noble-security
          Components: main restricted universe multiverse
          Architectures: riscv64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          
          sudo apt-get update
          
          sudo apt-get install -y \
            build-essential \
            crossbuild-essential-riscv64 \
            git \
            cmake \
            dpkg-dev
            
          sudo apt-get install -y \
            qtbase5-dev-tools \
            qttools5-dev-tools \
            qtchooser
            
          sudo apt-get install -y \
            qtbase5-dev:riscv64 \
            qtscript5-dev:riscv64 \
            qttools5-dev:riscv64 \
            libqt5svg5-dev:riscv64

      - name: Build DIE-engine
        run: |
          git clone --recursive https://github.com/horsicq/DIE-engine.git
          cd DIE-engine

          export CC=riscv64-linux-gnu-gcc
          export CXX=riscv64-linux-gnu-g++
          export PKG_CONFIG_PATH=/usr/lib/riscv64-linux-gnu/pkgconfig
          export CMAKE_PREFIX_PATH=/usr/lib/riscv64-linux-gnu
          
          sed -i '1i set(CMAKE_SYSTEM_NAME Linux)\nset(CMAKE_SYSTEM_PROCESSOR riscv64)\nset(X_PROJECT_ARCH riscv64)\nset(CPACK_DEBIAN_PACKAGE_ARCHITECTURE riscv64)\n' CMakeLists.txt
          
          sed -i 's/ARCH=$(dpkg --print-architecture.*/ARCH="riscv64"/g' build_dpkg.sh
          
          chmod a+x build_dpkg.sh
          ./build_dpkg.sh

      - name: Collect packages
        run: |
          mkdir -p "${{ env.RELEASE_PATH }}"

          find DIE-engine \
            -type f \
            -name "*.deb" \
            -exec cp {} "${{ env.RELEASE_PATH }}/" \;

      - name: Verify package architecture
        run: |
          shopt -s nullglob
          packages=("${{ env.RELEASE_PATH }}"/*.deb)

          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::No .deb packages found in the directory: ${{ env.RELEASE_PATH }}"
            ls -la "${{ env.RELEASE_PATH }}" || echo "Directory does not exist."
            exit 1
          fi

          echo "Found ${#packages[@]} package(s). Verifying architecture..."

          for package in "${packages[@]}"; do
            ARCH=$(dpkg-deb -f "$package" Architecture)
            echo "Checking $package (Architecture: $ARCH)"
            
            if [ "$ARCH" != "riscv64" ]; then
              echo "::error::Architecture mismatch in $package! Expected 'riscv64', but got '$ARCH'"
              exit 1
            fi
          done
          
          echo "All packages verified successfully."

      - name: Upload Release as Download
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tag_name: Beta
          draft: false
          prerelease: true
          files: |
            ${{ env.RELEASE_PATH }}/*.deb
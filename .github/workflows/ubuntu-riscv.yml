name: Build DIE-engine RISC-V64

on:
  workflow_dispatch:

jobs:
  build-riscv64:
    runs-on: ubuntu-latest

    steps:
      - name: Clone DIE-engine
        run: |
          git clone --recursive \
            https://github.com/horsicq/DIE-engine.git

      - name: Install RISC-V64 toolchain and Qt5 dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            cmake \
            ninja-build \
            pkg-config \
            build-essential \
            gcc-riscv64-linux-gnu \
            g++-riscv64-linux-gnu

      - name: Build RISC-V64
        working-directory: DIE-engine
        run: |
          cmake \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=riscv64 \
            -DCMAKE_C_COMPILER=riscv64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=riscv64-linux-gnu-g++

          cmake \
            --build build \
            --parallel $(nproc)

      - name: Verify architecture
        run: |
          file DIE-engine/build/* || true

      - name: Create Release Archive
        run: |
          mkdir -p release

          tar \
            -czf \
            release/detect-it-easy-4.0.0-linux-riscv64.tar.gz \
            -C DIE-engine/build \
            .

          ls -lh release

      - name: Upload Release as Download
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tag_name: Beta
          draft: false
          prerelease: true
          files: |
            release/*.tar.gz
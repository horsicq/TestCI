name: Build DIE-engine ARMhf

on:
  workflow_dispatch:

jobs:
  build-armhf:
    runs-on: ubuntu-latest

    steps:
      - name: Clone DIE-engine
        run: |
          git clone --recursive \
            https://github.com/horsicq/DIE-engine.git

      - name: Install ARMhf toolchain and host Qt tools
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            cmake \
            ninja-build \
            pkg-config \
            build-essential \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            qemu-user-static \
            debootstrap \
            binfmt-support \
            qtbase5-dev \
            qttools5-dev-tools

      - name: Create ARMhf Ubuntu Sysroot with Qt5
        run: |
          sudo mkdir -p /opt/armhf-sysroot

          sudo debootstrap \
            --arch=armhf \
            --foreign \
            --components=main,universe,multiverse,restricted \
            jammy \
            /opt/armhf-sysroot \
            http://ports.ubuntu.com/ubuntu-ports

          sudo cp /usr/bin/qemu-arm-static \
            /opt/armhf-sysroot/usr/bin/

          sudo chroot /opt/armhf-sysroot \
            /debootstrap/debootstrap \
            --second-stage

          sudo printf '%s\n' \
            "deb http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse" \
            "deb http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse" \
            "deb http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse" \
            | sudo tee /opt/armhf-sysroot/etc/apt/sources.list > /dev/null

          sudo chroot /opt/armhf-sysroot apt-get update

          sudo chroot /opt/armhf-sysroot apt-get install -y \
            qtbase5-dev \
            qtscript5-dev \
            qttools5-dev \
            qttools5-dev-tools \
            libqt5svg5-dev \
            libc6-armhf-cross

      - name: Configure ARMhf build
        working-directory: DIE-engine
        run: |
          rm -rf build

          cmake \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=arm \
            -DCMAKE_SYSROOT=/opt/armhf-sysroot \
            -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
            -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ \
            -DCMAKE_PREFIX_PATH=/opt/armhf-sysroot/usr/lib/arm-linux-gnueabihf/cmake \
            -DQT_MOC_EXECUTABLE=$(which moc) \
            -DQT_RCC_EXECUTABLE=$(which rcc) \
            -DQT_UIC_EXECUTABLE=$(which uic) \
            -DQT_LRELEASE_EXECUTABLE=$(which lrelease) \
            -DQT_LUPDATE_EXECUTABLE=$(which lupdate) \
            -DQT_HOST_PATH=/usr \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY

      - name: Build ARMhf
        working-directory: DIE-engine
        run: |
          cmake \
            --build build \
            --parallel $(nproc)

      - name: Check architecture
        run: |
          find DIE-engine/build \
            -type f \
            -executable \
            -exec file {} \;

      - name: Create Release Archive
        run: |
          mkdir -p release

          tar \
            -czf \
            release/detect-it-easy-4.0.0-linux-armhf.tar.gz \
            -C DIE-engine/build \
            .

      - name: Upload Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tag_name: Beta
          draft: false
          prerelease: true
          files: |
            release/*.tar.gz
name: Build DIE-engine ARMHF

on:
  workflow_dispatch:

jobs:
  build-armhf:
    runs-on: ubuntu-latest

    steps:
      - name: Enable QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Clone DIE-engine
        run: |
          git clone --recursive \
            https://github.com/horsicq/DIE-engine.git

      - name: Build DIE-engine (ARMHF)
        run: |
          docker run --rm \
            --platform linux/arm/v7 \
            -v "$PWD/DIE-engine:/DIE-engine" \
            ubuntu:22.04 \
            bash -c '
              set -eux

              export DEBIAN_FRONTEND=noninteractive

              apt-get update

             apt-get install -y \
             git \
             build-essential \
             cmake \
             ninja-build \
             pkg-config \
             qtbase5-dev \
             qtscript5-dev \
             qttools5-dev-tools \
             libqt5svg5-dev

              cd /DIE-engine

              cmake \
                -B build \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release

              cmake \
                --build build \
                --parallel $(nproc)
            '

      - name: Create Release Archive
        run: |
          mkdir -p release

          tar \
            -czf \
            release/detect-it-easy-4.0.0-linux-armhf.tar.gz \
            -C DIE-engine/build \
            .

          ls -lh release

      - name: Upload Release as Download
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tag_name: Beta
          draft: false
          prerelease: true
          files: |
            release/*.tar.gz
name: TestCI Android APK Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install Qt (Host Linux Desktop)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          modules: 'qt5compat'
          dir: ${{ github.workspace }}

      - name: Install Qt (Target Android)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qt5compat'
          dir: ${{ github.workspace }}

      - name: Clone DIE-engine
        run: |
          git clone --recursive https://github.com/horsicq/DIE-engine.git DIE-engine

      - name: Build Android APK
        run: |
          set -ex
          
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          export QT_ANDROID_PATH=${{ github.workspace }}/Qt/6.8.2/android_arm64_v8a
          export QT_HOST_PATH=${{ github.workspace }}/Qt/6.8.2/gcc_64
          
          cd DIE-engine
          mkdir build
          cd build
          
          cmake -G Ninja .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$QT_ANDROID_PATH \
            -DQT_HOST_PATH=$QT_HOST_PATH
            
          cmake --build . -j$(nproc)
          
          cmake --build . --target die_make_apk || cmake --build . --target apk || true
          
          mkdir -p ../release
          
          APK_FILE=$(find . -name "*.apk" | head -n 1)
          
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" ../release/DetectItEasy-GUI-Android-arm64.apk
          else
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DetectItEasy-Android-APK
          path: DIE-engine/release/*.apk

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: Android-Beta
          draft: false
          prerelease: true
          files: DIE-engine/release/*.apk
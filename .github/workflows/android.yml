name: Build DIE-engine Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Install Android tools
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk cmake ninja-build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.7.3
          host: linux
          target: android
          arch: android_arm64_v8a

      - name: Clone DIE-engine
        run: |
          git clone https://github.com/horsicq/DIE-engine.git --recursive

      - name: Configure
        working-directory: ${{ github.workspace }}/DIE-engine
        run: |
          cmake \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-35 \
            -DCMAKE_PREFIX_PATH=$Qt6_DIR

      - name: Build
        working-directory: ${{ github.workspace }}/DIE-engine
        run: |
          cmake --build build --parallel $(nproc)

      - name: Build APK
        working-directory: ${{ github.workspace }}/DIE-engine/build
        run: |
          $Qt6_DIR/bin/androiddeployqt \
            --input android-libDIE-engine-deployment-settings.json \
            --output android-build \
            --android-platform android-35 \
            --gradle

      - name: Collect APK
        working-directory: ${{ github.workspace }}/DIE-engine
        run: |
          mkdir -p release
          find build \
            -name "*.apk" \
            -exec cp {} release/DIE-engine-android.apk \;
          ls -lah release

      - name: Upload APK
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: Beta
          draft: false
          prerelease: true
          files: |
            ${{ github.workspace }}/DIE-engine/release/*.apk
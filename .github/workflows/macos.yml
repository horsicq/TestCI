name: macOS CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          cache: true

      - name: Clone Repository
        run: git clone https://github.com/horsicq/DIE-engine.git --recursive

      - name: Patch upstream bugs
        working-directory: ${{ github.workspace }}/DIE-engine
        run: |
          find dep/XArchive/Algos -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i '' 's/register //g' {} +
          
          sed -i '' '/define fdopen(fd,mode) NULL/d' dep/XArchive/Algos/zlibutil.cpp
          sed -i '' '/define fdopen(fd, mode) NULL/d' dep/XArchive/Algos/xdeflatedecoder.cpp
          
          find dep/XArchive/Algos -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i '' '/define local static/d' {} +
          find dep/XArchive/Algos -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i '' 's/^local /static /g' {} +
          find dep/XArchive/Algos -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i '' 's/ local / static /g' {} +

      - name: Configure
        working-directory: ${{ github.workspace }}/DIE-engine
        run: >
          cmake -S . -B build 
          -DCMAKE_BUILD_TYPE=Release 
          -DCMAKE_C_FLAGS="-w" 
          -DCMAKE_CXX_FLAGS="-w"

      - name: Build
        working-directory: ${{ github.workspace }}/DIE-engine
        run: cmake --build build --config Release --parallel $(sysctl -n hw.ncpu)

      - name: Create DMG
        working-directory: ${{ github.workspace }}/DIE-engine
        run: |
          APP_BUNDLE=$(find build -name "*.app" -maxdepth 2 | head -n 1)
          macdeployqt "$APP_BUNDLE" -dmg

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: Beta
          draft: false
          prerelease: true
          files: ${{ github.workspace }}/DIE-engine/build/*.dmg
name: macOS CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          cache: true

      - name: Clone Repository
        run: git clone https://github.com/horsicq/DIE-engine.git --recursive

      - name: Patch upstream bugs
        working-directory: ${{ github.workspace }}/DIE-engine
        run: |
          find dep/XArchive/Algos -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i '' 's/register //g' {} +
          
          sed -i '' '/define fdopen(fd,mode) NULL/d' dep/XArchive/Algos/zlibutil.cpp
          sed -i '' '/define fdopen(fd, mode) NULL/d' dep/XArchive/Algos/xdeflatedecoder.cpp
          
          find dep/XArchive/Algos -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i '' '/define local static/d' {} +
          find dep/XArchive/Algos -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i '' 's/^local /static /g' {} +
          find dep/XArchive/Algos -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i '' 's/ local / static /g' {} +

          find . -type f \( -name "CMakeLists.txt" -o -name "*.cmake" \) -exec sed -i '' 's/-framework AGL//g' {} +
          find . -type f \( -name "CMakeLists.txt" -o -name "*.cmake" \) -exec sed -i '' 's/"-framework AGL"//g' {} +
          find . -type f \( -name "CMakeLists.txt" -o -name "*.cmake" \) -exec sed -i '' 's/[[:<:]]AGL[[:>:]]//g' {} +

      - name: Create Fake AGL Framework
        working-directory: ${{ github.workspace }}/DIE-engine
        run: |
          mkdir -p build/FakeAGL/AGL.framework
          touch build/FakeAGL/AGL.framework/AGL

      - name: Configure
        working-directory: ${{ github.workspace }}/DIE-engine
        run: >
          cmake -S . -B build 
          -DCMAKE_BUILD_TYPE=Release 
          -DCMAKE_C_FLAGS="-w" 
          -DCMAKE_CXX_FLAGS="-w"
          -DCMAKE_EXE_LINKER_FLAGS="-FFakeAGL"
          -DCMAKE_SHARED_LINKER_FLAGS="-FFakeAGL"

      - name: AGL removal
        working-directory: ${{ github.workspace }}/DIE-engine/build
        run: |
          find . -type f \( -name "*.txt" -o -name "*.make" -o -name "*.cmake" -o -name "Makefile" \) -exec sed -i '' 's/AGL//g' {} + || true

      - name: Build
        working-directory: ${{ github.workspace }}/DIE-engine
        run: cmake --build build --config Release --parallel $(sysctl -n hw.ncpu)

      - name: Fix Qt SQL Bug for macdeployqt
        run: |
          echo "Lösche fehlerhafte Qt-SQL-Plugins NACH dem Build..."
          # So ist CMake zufrieden gewesen, aber macdeployqt crasht jetzt nicht mehr!
          find /Users/runner/work -type f \( -name "*qsqlodbc*.dylib" -o -name "*qsqlpsql*.dylib" \) -delete || true

      - name: Create DMG with die and diel
        working-directory: ${{ github.workspace }}/DIE-engine
        run: |
          APP_DIE=$(find build -name "die.app" -type d | head -n 1)
          APP_DIEL=$(find build -name "diel.app" -type d | head -n 1)
          
          if [ -n "$APP_DIE" ] && [ -n "$APP_DIEL" ]; then
            echo "Apps gefunden: $APP_DIE und $APP_DIEL"
            
            echo "Kopiere Qt-Frameworks in die.app..."
            macdeployqt "$APP_DIE" -always-overwrite || true
            
            echo "Kopiere Qt-Frameworks in diel.app..."
            macdeployqt "$APP_DIEL" -always-overwrite || true
            
            mkdir -p dmg_staging
            
            cp -a "$APP_DIE" dmg_staging/
            cp -a "$APP_DIEL" dmg_staging/
            
            ln -s /Applications dmg_staging/Applications
            
            echo "Packe DMG..."
            hdiutil create -volname "DetectItEasy" -srcfolder dmg_staging -ov -format UDZO DetectItEasy.dmg
            
            mv DetectItEasy.dmg build/DetectItEasy.dmg
          else
            echo "Fehler: Mindestens eine der Apps (die.app oder diel.app) wurde nicht gefunden!"
            exit 1
          fi

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: Beta
          draft: false
          prerelease: true
          files: ${{ github.workspace }}/DIE-engine/build/*.dmg
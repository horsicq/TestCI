name: macOS CI (Raw CMake)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-osx-raw:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt via Homebrew
        run: |
          brew update
          brew install qt@5

      - name: Clone DIE-engine
        run: |
          git clone https://github.com/horsicq/DIE-engine.git --recursive

      - name: Patch CMake Scope Errors
        run: |
          sed -i '' '/macdeployqt\.cmake/s/^/#/' DIE-engine/src/lite/CMakeLists.txt || true
          sed -i '' '/macdeployqt\.cmake/s/^/#/' DIE-engine/src/console/CMakeLists.txt || true

      - name: Build DiE macOS (Raw CMake & Clang)
        run: |
          export QT_DIR="$(brew --prefix qt@5)"
          export PATH="$QT_DIR/bin:$PATH"
          export CMAKE_PREFIX_PATH="$QT_DIR"
          
          export CC=clang
          export CXX=clang++
          
          cd DIE-engine
          mkdir build
          cd build
          
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64"
            
          cmake --build . --config Release --verbose -j 1
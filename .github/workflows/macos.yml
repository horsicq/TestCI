name: macOS CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-osx:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt via Homebrew
        run: |
          brew update
          brew install qt@5
          brew link qt@5 --force

      - name: Clone DIE-engine
        run: |
          git clone https://github.com/horsicq/DIE-engine.git --recursive

      - name: Patch CMake Scope Errors
        run: |
          sed -i '' '/macdeployqt\.cmake/s/^/#/' DIE-engine/src/lite/CMakeLists.txt || true
          sed -i '' '/macdeployqt\.cmake/s/^/#/' DIE-engine/src/console/CMakeLists.txt || true

      - name: Build DiE macOS
        run: |
          export PATH="$(brew --prefix qt)/bin:$PATH"
          export CMAKE_PREFIX_PATH="$(brew --prefix qt)"
          
          export MAKEFLAGS="-j1"
          
          cd DIE-engine
          chmod a+x build_mac.sh
          ./build_mac.sh

      - name: Upload macOS Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Beta
          draft: false
          prerelease: true
          files: |
            DIE-engine/release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
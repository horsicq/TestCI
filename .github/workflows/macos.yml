name: Build DIE-engine (macOS)

on:
  workflow_dispatch:

jobs:
  build-macos:

    runs-on: macos-latest

    steps:
      - name: Install dependencies
        run: |
          brew update

          brew install \
            git \
            cmake \
            ninja \
            qt@5

      - name: Clone DIE-engine
        run: |
          git clone \
            --recursive \
            https://github.com/horsicq/DIE-engine.git

      - name: Disable macdeployqt
        working-directory: DIE-engine
        run: |
          sed -i.bak \
            '/macdeployqt\.cmake/s/^/# /' \
            src/lite/CMakeLists.txt

          rm -f src/lite/CMakeLists.txt.bak

          grep -n "macdeployqt" src/lite/CMakeLists.txt || true

      - name: Configure
        working-directory: DIE-engine
        run: |
          export PATH="$(brew --prefix qt@5)/bin:$PATH"

          cmake \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@5)"

      - name: Build
        working-directory: DIE-engine
        run: |
          cmake \
            --build build \
            --parallel "$(sysctl -n hw.ncpu)"

      - name: Show build output
        working-directory: DIE-engine
        run: |
          find build -maxdepth 3 -type f | head -100

      - name: Create release archive
        working-directory: DIE-engine
        run: |
          mkdir -p release

          tar \
            -czf \
            release/detect-it-easy-4.0.0-macos.tar.gz \
            -C build \
            .

          ls -lh release

      - name: Upload Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Beta
          draft: false
          prerelease: true
          files: |
            DIE-engine/release/*.tar.gz
name: Build DIE-engine (Alpine)

on:
  workflow_dispatch:

jobs:
  build-alpine:
    runs-on: ubuntu-latest
    container: alpine:latest

    steps:
      - name: Install dependencies
        run: |
          apk update
          apk add qt5-qtbase-dev qt5-qtscript-dev qt5-qttools-dev qt5-qtsvg-dev git build-base pkgconf sudo

      - name: Create user
        run: |
          adduser -D builduser
          echo "builduser ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Clone DIE-engine
        run: |
          git clone --recursive https://github.com/horsicq/DIE-engine.git /home/builduser/DIE-engine
          chown -R builduser:builduser /home/builduser/DIE-engine

      - name: Build
        run: |
          sudo -u builduser sh -c '
            cd /home/builduser/DIE-engine
            mkdir build
            cd build
            qmake ../die_source.pro CONFIG+=release
            make -j$(nproc)
          '

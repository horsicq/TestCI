name: Build DIE-engine (Alpine)

on:
  workflow_dispatch:

jobs:
  build-alpine:
    runs-on: ubuntu-latest

    container:
      image: alpine:latest

    steps:
- name: Install dependencies
        run: |
          apk update
          apk add \
            alpine-sdk \
            bash \
            sudo \
            doas \
            git \
            cmake \
            pkgconf \
            qt5-qtbase-dev \
            qt5-qtscript-dev \
            qt5-qttools-dev \
            qt5-qtsvg-dev \
            linux-headers

      - name: Clone DIE-engine
        run: |
          git clone --recursive \
            https://github.com/horsicq/DIE-engine.git \
            /opt/DIE-engine

      - name: Build Alpine APK
        run: |
          cd /opt/DIE-engine

          adduser -D builduser || true
          adduser builduser abuild || true
          
          echo "builduser ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

          chown -R builduser:abuild /opt/DIE-engine

          mkdir -p /home/builduser/.abuild
          chown -R builduser:abuild /home/builduser/.abuild
          sudo -u builduser abuild-keygen -a -i -n

          chmod a+x build_alpinepkg.sh

          bash -x build_alpinepkg.sh

      - name: Verify APK
        run: |
          mkdir -p release

          find /opt/DIE-engine \
            -name "*.apk" \
            -exec cp {} release/DetectItEasy-alpine.apk \;

          ls -lah release

          test -f release/DetectItEasy-alpine.apk

      - name: Upload Release APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Beta
          draft: false
          prerelease: true
          files: |
            release/*.apk
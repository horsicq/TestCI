name: Build Ubuntu 24 PPC64LE

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

env:
  RELEASE_PATH: release

jobs:
  build-ubuntu-24-ppc64le:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Dependencies
        run: |
          sudo dpkg --add-architecture ppc64el
          
          sudo sed -i 's/^Types: deb/Types: deb\nArchitectures: amd64/' /etc/apt/sources.list.d/ubuntu.sources
          
          sudo find /etc/apt/sources.list* -type f -name "*.list" -exec sed -i -E 's/^deb ([^\[])/deb [arch=amd64] \1/g' {} +
          
          cat <<EOF | sudo tee /etc/apt/sources.list.d/ubuntu-ports.sources
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: noble noble-updates noble-backports noble-security
          Components: main restricted universe multiverse
          Architectures: ppc64el
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          
          sudo apt-get update
          
          sudo apt-get install -y \
            build-essential \
            crossbuild-essential-ppc64el \
            git \
            cmake \
            dpkg-dev
            
          sudo apt-get install -y \
            qtbase5-dev-tools \
            qttools5-dev-tools \
            qtchooser
            
          sudo apt-get install -y \
            qtbase5-dev:ppc64el \
            qtscript5-dev:ppc64el \
            qttools5-dev:ppc64el \
            libqt5svg5-dev:ppc64el

      - name: Build DIE-engine
        run: |
          git clone --recursive https://github.com/horsicq/DIE-engine.git
          cd DIE-engine

          export CC=powerpc64le-linux-gnu-gcc
          export CXX=powerpc64le-linux-gnu-g++
          export PKG_CONFIG_PATH=/usr/lib/powerpc64le-linux-gnu/pkgconfig
          
          sed -i '1i set(CMAKE_SYSTEM_NAME Linux)\nset(CMAKE_SYSTEM_PROCESSOR ppc64le)\nset(X_PROJECT_ARCH ppc64le)\nset(CPACK_DEBIAN_PACKAGE_ARCHITECTURE ppc64el)\n' CMakeLists.txt

          sed -i 's|cmake |cmake -DCMAKE_PREFIX_PATH=/usr/lib/powerpc64le-linux-gnu |g' build_dpkg.sh || true
          
          chmod a+x build_dpkg.sh
          ./build_dpkg.sh

      - name: Collect packages
        run: |
          mkdir -p "${{ env.RELEASE_PATH }}"

          find DIE-engine \
            -type f \
            -name "*.deb" \
            -exec cp {} "${{ env.RELEASE_PATH }}/" \;

      - name: Verify package architecture
        run: |
          shopt -s nullglob
          packages=("${{ env.RELEASE_PATH }}"/*.deb)

          if [ ${#packages[@]} -eq 0 ]; then
            exit 1
          fi

          for package in "${packages[@]}"; do
            if [ "$(dpkg-deb -f "$package" Architecture)" != "ppc64el" ]; then
              exit 1
            fi
          done

      - name: Upload Release as Download
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tag_name: Beta
          draft: false
          prerelease: true
          files: |
            ${{ env.RELEASE_PATH }}/*.deb
name: Build Ubuntu 24 PPC64LE

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

env:
  SRC_PATH: Detect-It-Easy
  RELEASE_PATH: release

jobs:
  build-ubuntu-24-ppc64le:
    name: Build Ubuntu 24 PPC64LE
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          path: ${{ env.SRC_PATH }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ppc64le

      - name: Prepare release directory
        run: |
          mkdir -p "${{ env.RELEASE_PATH }}"

      - name: Build PPC64LE
        run: |
          docker run --rm \
            --platform linux/ppc64le \
            -v "${{ github.workspace }}:/workspace" \
            -w "/workspace/${{ env.SRC_PATH }}" \
            ubuntu:24.04 \
            bash -ex -c '
              apt-get update

              apt-get install -y \
                qtbase5-dev \
                qtscript5-dev \
                qttools5-dev \
                qttools5-dev-tools \
                libqt5svg5-dev \
                qtchooser \
                build-essential
              pwd
              bash -ex build_dpkg.sh
            '

      - name: Collect packages
        run: |
          find "${{ env.SRC_PATH }}" \
            -type f \
            -name "*.deb" \
            -exec cp {} "${{ env.RELEASE_PATH }}/" \;

      - name: Verify packages
        run: |
          shopt -s nullglob
          packages=("${{ env.RELEASE_PATH }}"/*.deb)

          if [ ${#packages[@]} -eq 0 ]; then
            echo "No .deb package was produced."
            exit 1
          fi

          for package in "${packages[@]}"; do
            echo "Package: $package"
            dpkg-deb -f "$package" Package
            dpkg-deb -f "$package" Version
            echo "Architecture:"
            dpkg-deb -f "$package" Architecture

            if [ "$(dpkg-deb -f "$package" Architecture)" != "ppc64el" ]; then
              echo "ERROR: Package is not ppc64el!"
              exit 1
            fi
          done

      - name: List release files
        run: |
          ls -lah "${{ env.RELEASE_PATH }}"

      - name: Upload Release as Download
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tag_name: Beta
          draft: false
          prerelease: true
          files: |
            ${{ env.RELEASE_PATH }}/*.deb
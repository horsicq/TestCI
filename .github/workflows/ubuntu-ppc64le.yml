name: Build Ubuntu 24 PPC64LE

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

env:
  RELEASE_PATH: release

jobs:
  build-ubuntu-24-ppc64le:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Dependencies
        run: |
          sudo dpkg --add-architecture ppc64el
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            crossbuild-essential-ppc64el \
            git \
            cmake \
            dpkg-dev

          sudo apt-get install -y \
            qtbase5-dev-tools \
            qttools5-dev-tools \
            qtchooser

          sudo apt-get install -y \
            qtbase5-dev:ppc64el \
            qtscript5-dev:ppc64el \
            qttools5-dev:ppc64el \
            libqt5svg5-dev:ppc64el

      - name: Build DIE-engine
        run: |
          git clone --recursive https://github.com/horsicq/DIE-engine.git
          cd DIE-engine

          export CC=powerpc64le-linux-gnu-gcc
          export CXX=powerpc64le-linux-gnu-g++
          export PKG_CONFIG_PATH=/usr/lib/powerpc64le-linux-gnu/pkgconfig
          export DEB_BUILD_OPTIONS=nocheck

          sed -i 's/dpkg-buildpackage/dpkg-buildpackage -a ppc64el/g' build_dpkg.sh || true

          chmod a+x build_dpkg.sh
          ./build_dpkg.sh

      - name: Collect packages
        run: |
          mkdir -p "${{ env.RELEASE_PATH }}"

          find DIE-engine \
            -type f \
            -name "*.deb" \
            -exec cp {} "${{ env.RELEASE_PATH }}/" \;

      - name: Verify package architecture
        run: |
          shopt -s nullglob
          packages=("${{ env.RELEASE_PATH }}"/*.deb)

          if [ ${#packages[@]} -eq 0 ]; then
            echo "No .deb package was produced."
            exit 1
          fi

          for package in "${packages[@]}"; do
            echo "Package: $package"
            echo "Architecture: $(dpkg-deb -f "$package" Architecture)"

            if [ "$(dpkg-deb -f "$package" Architecture)" != "ppc64el" ]; then
              echo "ERROR: Package is not ppc64el!"
              exit 1
            fi
          done

      - name: Upload Release as Download
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          tag_name: Beta
          draft: false
          prerelease: true
          files: |
            ${{ env.RELEASE_PATH }}/*.deb
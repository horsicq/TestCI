name: Build Windows ARM64 (Qt 6.10.2) with CMake

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  SRC_PATH: ${{ github.workspace }}\DIE-engine
  RELEASE_PATH: ${{ github.workspace }}\DIE-engine\release

jobs:
  build-windows-arm64-cmake:
    name: Build Windows ARM64 (CMake)
    runs-on: windows-2025
    
    steps:
      - name: Clone DIE-engine Repository
        run: git clone https://github.com/horsicq/DIE-engine.git --recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Install Qt (ARM64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_arm64'
          dir: ${{ github.workspace }}
          modules: qt5compat

      - name: Build with CMake & Package
        shell: cmd
        working-directory: ${{ env.SRC_PATH }}
        run: |
          set QT_PREFIX_PATH=${{ github.workspace }}\Qt\6.10.2\msvc2022_arm64
          set SEVENZIP_PATH="C:\Program Files\7-Zip\7z.exe"
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A ARM64 -DCMAKE_PREFIX_PATH="%QT_PREFIX_PATH%" -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release -j %NUMBER_OF_PROCESSORS%
          for %%f in (Release\*.exe) do (
            "%QT_PREFIX_PATH%\bin\windeployqt.exe" --release "%%f"
          )
          cd ..
          mkdir release
          %SEVENZIP_PATH% a release\die_winarm64_qt6.zip .\build\Release\*
          dir release\*.zip >nul 2>&1
          if %ERRORLEVEL% neq 0 (
            exit /b 1
          )

      - name: Upload Release as Download
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: Beta
          draft: false
          prerelease: true
          files: |
            ${{ env.RELEASE_PATH }}\*.zip
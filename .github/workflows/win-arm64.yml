name: Build Windows ARM64 (Qt 6.8.2) with CMake

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  SRC_PATH: ${{ github.workspace }}\DIE-engine
  RELEASE_PATH: ${{ github.workspace }}\DIE-engine\release

jobs:
  build-windows-arm64-cmake:
    name: Build Windows ARM64 (CMake)
    runs-on: windows-2022
    
    steps:
      - name: Clone DIE-engine Repository
        run: git clone https://github.com/horsicq/DIE-engine.git --recursive

      - name: Patch source files for ARM64
        shell: pwsh
        working-directory: ${{ env.SRC_PATH }}
        run: |
          $file = "dep\Formats\xsimd\src\xsimd_sse2.c"
          if (Test-Path $file) { Set-Content -Path $file -Value "" }

      - name: Install Qt (Host x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          dir: ${{ github.workspace }}
          modules: qt5compat

      - name: Install Qt (Target ARM64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_arm64_cross_compiled'
          dir: ${{ github.workspace }}
          modules: qt5compat

      - name: Build with CMake & Package
        shell: pwsh
        working-directory: ${{ env.SRC_PATH }}
        run: |
          $QT_HOST = "${{ github.workspace }}\Qt\6.8.2\msvc2022_64"
          $QT_TARGET = "${{ github.workspace }}\Qt\6.8.2\msvc2022_arm64"
          $7ZIP = "C:\Program Files\7-Zip\7z.exe"
          New-Item -ItemType Directory -Force -Path build
          Set-Location build
          cmake .. -G "Visual Studio 17 2022" -A ARM64 -DCMAKE_PREFIX_PATH="$QT_TARGET" -DQT_HOST_PATH="$QT_HOST" -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "CMake Config fehlgeschlagen" }
          cmake --build . --config Release -j $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE -ne 0) { throw "CMake Build fehlgeschlagen" }
          Set-Location ..
          $OUT_DIR = "release_temp"
          New-Item -ItemType Directory -Force -Path $OUT_DIR
          Copy-Item -Path "build\Release\*" -Destination $OUT_DIR -Recurse -Force
          Get-ChildItem -Path $OUT_DIR -Filter "*.exe" | ForEach-Object {
              & "$QT_TARGET\bin\windeployqt.exe" --release $_.FullName
          }
          if (Test-Path "db") { Copy-Item -Path "db" -Destination "$OUT_DIR\db" -Recurse -Force }
          if (Test-Path "info") { Copy-Item -Path "info" -Destination "$OUT_DIR\info" -Recurse -Force }
          New-Item -ItemType Directory -Force -Path release
          & $7ZIP a release\die_winarm64_qt6.zip .\$OUT_DIR\*
          if ($LASTEXITCODE -ne 0) { throw "7-Zip fehlgeschlagen" }

      - name: Upload Release as Download
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: Beta
          draft: false
          prerelease: true
          files: |
            ${{ env.RELEASE_PATH }}\*.zip
name: Termux CI (CLI)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-termux:
    runs-on: ubuntu-latest

    steps:
      - name: Create Output Directory on Host
        run: |
          mkdir -p output_termux
          chmod 777 output_termux

      - name: Build inside Termux Docker
        run: |
          docker run --rm -v ${{ github.workspace }}/output_termux:/output termux/termux-docker:latest bash -c "
            pkg update -y
            pkg install -y x11-repo
            pkg install -y clang cmake make git tar qt6-qtbase qt6-qtsvg qt6-qtdeclarative qt6-qt5compat qt6-qttools
            
            mkdir -p /data/data/com.termux/files/usr/lib/qt6/plugins/platformthemes
            touch /data/data/com.termux/files/usr/lib/qt6/plugins/platformthemes/libqgtk3.so
            
            cd ~
            git clone https://github.com/horsicq/DIE-engine.git --recursive DIE-engine
            cd DIE-engine
            
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build --target diec --parallel \$(nproc)
            
            mkdir -p release_termux
            
            cp build/src/console/diec release_termux/ 2>/dev/null || true
            cp -r db release_termux/ 2>/dev/null || true
            cp -r info release_termux/ 2>/dev/null || true
            
            tar -czvf /output/DetectItEasy_Termux_CLI.tar.gz -C release_termux .
          "

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DetectItEasy-Termux-CLI
          path: output_termux/DetectItEasy_Termux_CLI.tar.gz

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: Beta
          draft: false
          prerelease: true
          files: output_termux/DetectItEasy_Termux_CLI.tar.gz
name: Build SafeNova APK

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java (required for Android build)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Manually clone the SafeNova repository
        run: |
          git clone https://github.com/DosX-dev/SafeNova.git SafeNova

      - name: Prepare Capacitor project
        run: |
          # Create a default package.json
          npm init -y
          
          # Install Capacitor dependencies
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          mv SafeNova www
          rm -rf www/.git
          
          npx cap init "SafeNova" "com.dosx.safenova" --web-dir www
          
          npx cap add android

      - name: Build the APK
        run: |
          cd android
          # Grant execution permissions to the Gradle wrapper
          chmod +x gradlew
          # Compile the debug APK
          ./gradlew assembleDebug

      - name: Upload the compiled APK as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeNova-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
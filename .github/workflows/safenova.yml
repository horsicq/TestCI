name: Build SafeNova Beta (Daily)

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 3 * * *' 

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Clone SafeNova Repository
        run: git clone https://github.com/DosX-dev/SafeNova.git SafeNova

      - name: Prepare Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "SafeNova" "com.dosx.safenova" --web-dir "SafeNova/src"
          npx cap add android

      - name: Fix Kotlin Duplicate Classes
        run: |
          cat << 'EOF' >> android/app/build.gradle
          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Generate Date Tag
        id: date_tag
        run: |
          echo "BETA_TAG=Beta-$(date +'%Y-%m-%d-%H%M')" >> $GITHUB_ENV

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk SafeNova-${{ env.BETA_TAG }}.apk

      - name: Create Git Tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag ${{ env.BETA_TAG }}
          git push origin ${{ env.BETA_TAG }}

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BETA_TAG }}
          name: SafeNova Daily Build (${{ env.BETA_TAG }})
          files: SafeNova-${{ env.BETA_TAG }}.apk
          draft: false
          prerelease: true